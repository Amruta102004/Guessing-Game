<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🎯 Guessing Game</h1>  

        <p class="description">
            I have selected a random number. Can u guess it?
        </p>

        <div class="game-box">
            <label for="maxNumber">
                Enter Maximum Number 
            </label>
            <input
                type="number"
                id="maxNumber"
                placeholder="Example: 100"
                min="1"
            >
            <button class="startBtn">Start Game</button>

            <div id="gameArea" class="hidden">

                <p id="rangeText"></p>

                <input 
                    type="number"
                    id="guessInput"
                    placeholder="Enter Your Guess"
                >

                <button id="guessBtn">Submit Guess</button>

                <p id="message"></p>

                <p class="attempts">Attempts: <span id="attemptCount">0</span> </p>

                <button id="restartBtn">🔄 New Game</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
